[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yugabyte-decolocate-tables"
dynamic = ["version"]
description = "Migrate colocated YugabyteDB YSQL tables to uncollocated storage"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [
    { name = "Tony Caldera" },
]
keywords = ["yugabyte", "yugabytedb", "ysql", "colocation", "migration", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/ajcaldera1/yugabyte-decolocate-tables"
Documentation = "https://github.com/ajcaldera1/yugabyte-decolocate-tables#readme"
Repository = "https://github.com/ajcaldera1/yugabyte-decolocate-tables"
Issues = "https://github.com/ajcaldera1/yugabyte-decolocate-tables/issues"

[project.scripts]
decolocate-tables = "decolocate_tables.cli:main"

[tool.hatch.version]
path = "src/decolocate_tables/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/decolocate_tables"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
